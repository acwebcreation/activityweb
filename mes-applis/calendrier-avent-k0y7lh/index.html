<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendrier de l'Avent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ed-bg:#F2F4F0; --ed-ink:#22302A; --ed-muted:#5E6B63; --ed-line:#D5DCD4;
  --ed-card:#FFFFFF; --ed-primary:#1F3D2F; --ed-red:#B23A2B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.no-scroll{overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;cursor:pointer}

/* ---------- Boutons ---------- */
.btn{border:0;border-radius:999px;padding:.7em 1.3em;font-weight:700;font-size:.95rem;line-height:1.2}
.btn-primary{background:var(--ed-primary);color:#fff}
.btn-primary:hover{background:#163024}
.btn-ghost{background:transparent;color:var(--ed-primary);box-shadow:inset 0 0 0 2px var(--ed-primary)}
.btn-link{background:none;border:0;padding:0;color:var(--ed-primary);font-weight:700;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.btn-link.danger{color:var(--ed-red)}
.btn:focus-visible,.btn-link:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #D9A441;outline-offset:2px}

/* ---------- Éditeur ---------- */
body.mode-editor{background:var(--ed-bg);color:var(--ed-ink)}
.editor{max-width:780px;margin:0 auto;padding:40px 18px 0}
.ed-head h1{font-family:var(--serif);font-weight:800;font-size:clamp(2rem,6vw,2.9rem);line-height:1.05;margin:0 0 .4em;text-wrap:balance}
.ed-head p{margin:0;color:var(--ed-muted);max-width:60ch}
.ed-section{margin-top:40px}
.ed-section h2{font-family:var(--serif);font-weight:600;font-size:1.45rem;margin:0 0 .6em}
.ed-section .hint{color:var(--ed-muted);margin:-.3em 0 1em;font-size:.95rem}
.fields{display:grid;gap:14px}
@media(min-width:640px){.fields{grid-template-columns:1fr 1fr}.fields .full{grid-column:1/-1}}
.field{display:grid;gap:4px}
.field-label{font-weight:700;font-size:.9rem}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ed-ink);background:var(--ed-card);border:1.5px solid var(--ed-line);border-radius:10px;padding:.6em .75em}
textarea{resize:vertical;min-height:84px;line-height:1.45}
.themes{display:flex;flex-wrap:wrap;gap:10px}
.theme-opt{display:flex;align-items:center;gap:10px;background:var(--ed-card);border:1.5px solid var(--ed-line);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600}
.theme-opt input{accent-color:var(--ed-primary)}
.theme-opt:has(input:checked){border-color:var(--ed-primary);box-shadow:inset 0 0 0 1px var(--ed-primary)}
.swatch{display:flex}
.swatch i{width:18px;height:18px;border-radius:50%;margin-left:-5px;border:2px solid var(--ed-card)}
.swatch i:first-child{margin-left:0}
.theme-opt[data-theme=sapin] i:nth-child(1){background:#1F3D2F}.theme-opt[data-theme=sapin] i:nth-child(2){background:#F6EBD9}.theme-opt[data-theme=sapin] i:nth-child(3){background:#8E2A25}
.theme-opt[data-theme=epices] i:nth-child(1){background:#EBCFA6}.theme-opt[data-theme=epices] i:nth-child(2){background:#A9602F}.theme-opt[data-theme=epices] i:nth-child(3){background:#B23A2B}
.theme-opt[data-theme=nuit] i:nth-child(1){background:#1C2340}.theme-opt[data-theme=nuit] i:nth-child(2){background:#E9C46A}.theme-opt[data-theme=nuit] i:nth-child(3){background:#2E3866}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:.95rem}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ed-primary);flex:none}
.ideas-for{margin-bottom:14px}
.idea-btn{margin-left:auto}
.days-tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:16px}
.days{display:grid;gap:12px}
@media(min-width:640px){.days{grid-template-columns:1fr 1fr}}
.day{background:var(--ed-card);border:1.5px solid var(--ed-line);border-radius:14px;padding:14px;display:grid;gap:10px}
.day-head{display:flex;align-items:baseline;gap:8px}
.day-num{font-family:var(--serif);font-weight:800;font-size:1.8rem;line-height:1;color:var(--ed-primary)}
.day-month{color:var(--ed-muted);font-size:.9rem}
.day textarea{min-height:76px}
.day-photo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px}
.ed-foot{margin:28px 0 12px;display:flex;justify-content:flex-end}
.bar{position:sticky;bottom:0;margin-top:24px;background:rgba(242,244,240,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1.5px solid var(--ed-line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.progress{font-weight:700;font-size:.95rem}
.bar-actions{display:flex;gap:8px}
@media(max-width:480px){.bar .btn{padding:.65em 1em;font-size:.88rem}.bar-in{justify-content:center}}

/* ---------- Aperçu ---------- */
.preview-layer{position:fixed;inset:0;z-index:20;overflow:auto;background:#000}
.preview-bar{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ed-bg);color:var(--ed-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;font-size:.9rem;border-bottom:1.5px solid var(--ed-line)}
.preview-bar span{max-width:52ch}

/* ---------- Calendrier (ce que reçoit la personne) ---------- */
.viewer{min-height:100vh;min-height:100dvh;padding:40px 16px 56px;background-color:var(--bg);color:var(--ink)}
.viewer[data-theme=sapin]{--bg:#1F3D2F;--ink:#F6EBD9;--door:#F6EBD9;--door-ink:#1F3D2F;--inside:#8E2A25;--accent:#D9A441;--deco:#C2352F;--card:#FBF3E6;--card-ink:#1F3D2F}
.viewer[data-theme=epices]{--bg:#EBCFA6;--ink:#5A2E1A;--door:#A9602F;--door-ink:#FFF6EA;--inside:#5A2E1A;--accent:#B23A2B;--deco:#6E2417;--card:#FFF6EA;--card-ink:#5A2E1A}
.viewer[data-theme=nuit]{--bg:#1C2340;--ink:#F4F1FF;--door:#E9C46A;--door-ink:#1C2340;--inside:#2E3866;--accent:#E9C46A;--deco:#B23A48;--card:#F7F4FF;--card-ink:#1C2340}
.viewer[data-theme=sapin],.viewer[data-theme=nuit]{
  background-image:
    radial-gradient(circle at 18% 22%,rgba(255,255,255,.55) 0 1px,transparent 1.6px),
    radial-gradient(circle at 72% 64%,rgba(255,255,255,.35) 0 1px,transparent 1.6px),
    radial-gradient(circle at 44% 88%,rgba(255,255,255,.45) 0 1.2px,transparent 1.8px);
  background-size:170px 170px,230px 230px,290px 290px}
.viewer[data-theme=epices]{background-image:radial-gradient(circle at 50% 50%,rgba(90,46,26,.12) 0 1.5px,transparent 2px);background-size:26px 26px}
.v-inner{max-width:900px;margin:0 auto}
.v-head{text-align:center;margin-bottom:28px}
.v-title{font-family:var(--serif);font-weight:800;font-size:clamp(2.1rem,8vw,3.6rem);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
.v-dedi{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,3.5vw,1.3rem);margin:.6em 0 0;opacity:.9}
.v-status{margin:1.1em auto 0;font-size:.95rem;max-width:44ch;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;grid-auto-rows:calc((min(100vw - 32px,900px) - 30px)/4)}
@media(min-width:720px){
  .viewer{padding:56px 24px 72px}
  .grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;grid-auto-rows:calc((min(100vw - 48px,900px) - 60px)/6)}
}
.door{grid-column:var(--cm)/span var(--sc);grid-row:var(--rm)/span var(--sr)}
@media(min-width:720px){.door{grid-column:var(--cd)/span var(--sc);grid-row:var(--rd)/span var(--sr)}}
.door{position:relative;border:0;padding:0;background:none;perspective:1000px;border-radius:10px;color:inherit}
.door:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.door-inside{position:absolute;inset:0;border-radius:10px;background-color:var(--inside);background-size:cover;background-position:center;display:grid;place-items:center;box-shadow:inset 0 3px 10px rgba(0,0,0,.35);color:var(--accent);font-size:1.6rem}
.door-front{position:absolute;inset:0;border-radius:10px;background:var(--door);color:var(--door-ink);transform-origin:left center;transition:transform .6s cubic-bezier(.3,.7,.2,1),box-shadow .3s;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;padding:9px 11px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.door-front::before{content:"";position:absolute;inset:5px;border:1.5px dashed currentColor;border-radius:7px;opacity:.3;pointer-events:none}
.pos-a .door-front{align-items:flex-end;justify-content:flex-start}
.pos-b .door-front{align-items:flex-start;justify-content:flex-end}
.pos-c .door-front{align-items:center;justify-content:center}
.door-front{container-type:size}
.deco{position:absolute;height:min(40cqh,46cqw);width:auto;aspect-ratio:1;overflow:visible}
.deco .a{fill:var(--deco)}
.deco .b{fill:var(--door)}
.deco .s{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.deco .as{stroke:var(--deco);stroke-width:3.5}
.deco .ad{stroke:var(--deco)}
.pos-a .deco{top:11%;right:11%}
.pos-b .deco{bottom:11%;left:11%}
.pos-c .door-front{flex-direction:column;gap:5%}
.pos-c .deco{position:static;height:min(34cqh,42cqw)}
.big .deco{height:min(44cqh,44cqw)}
.num{position:relative;font-family:var(--serif);font-weight:800;font-size:clamp(1.3rem,5vw,2rem);line-height:1}
.big .num{font-size:clamp(2.4rem,11vw,4.4rem)}
.door:not(.is-open):hover .door-front{transform:rotateY(-10deg)}
.door.is-open .door-front{transform:rotateY(-104deg);box-shadow:none}
.door.is-today:not(.is-open) .door-front{box-shadow:0 0 0 3px var(--accent),0 2px 0 rgba(0,0,0,.18)}
.door.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

.day-dialog{border:0;padding:0;border-radius:18px;max-width:min(440px,calc(100vw - 32px));width:100%;background:var(--card);color:var(--card-ink)}
.day-dialog::backdrop{background:rgba(10,14,12,.6)}
.dlg-inner{padding:26px 24px 22px;display:grid;gap:16px}
.dlg-num{margin:0;font-family:var(--serif);font-size:1.05rem;display:flex;align-items:baseline;gap:8px}
.dlg-num span{font-weight:800;font-size:3rem;line-height:.9;color:var(--accent)}
.viewer[data-theme=nuit] .dlg-num span{color:#B0852A}
.dlg-photo{width:100%;max-height:52vh;object-fit:cover;border-radius:12px}
.dlg-text{margin:0;font-family:var(--serif);font-size:1.25rem;line-height:1.5;white-space:pre-wrap}
.dlg-close{justify-self:end;background:var(--card-ink);color:var(--card)}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#1b1f1d;color:#fff;padding:.7em 1.1em;border-radius:12px;font-size:.92rem;max-width:min(92vw,440px);z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}

@media (prefers-reduced-motion: reduce){
  .door-front{transition:none}
  .door.shake{animation:none}
}
</style>
</head>

function isUnlocked(n) {
  var d = new Date();

}
function statusText(data, preview) {

  if (data.free) return "Toutes les cases peuvent être ouvertes. Clique sur une case pour découvrir sa surprise.";
  var d = new Date();
  if (d.getMonth() === 11 && d.getDate() <= 24) return 'Nous sommes le ' + d.getDate() + ' décembre. La case du jour t\u2019attend.';

    .concat(IDEA_EXTRA[pack] || []);

function pickIdea(i) {
  var pack = IDEA_PACKS[draft.ideas] ? draft.ideas : 'enfant';
  var base = IDEA_PACKS[pack];
  var cur = (draft.days[i].text || '').trim();
  if (FIXED_DAYS.indexOf(i) !== -1 && cur !== base[i]) return base[i];
  var used = draft.days.map(function (d) { return (d.text || '').trim(); });
  var pool = ideaPool(pack).filter(function (t) { return used.indexOf(t) === -1; });
  if (!pool.length) pool = ideaPool(pack).filter(function (t) { return t !== cur; });

}

    document.body.append(layer);
    document.body.classList.add('no-scroll');
    renderViewer(holder, draft, { preview: true });
    closeBtn.focus();
  }

  var editor = h('main', { class: 'editor' },
    h('header', { class: 'ed-head' },
      h('h1', { text: 'Crée ton calendrier de l\u2019Avent' }),
      h('p', { text: 'Écris une petite surprise pour chaque jour, ajoute des photos si tu veux, puis télécharge ton calendrier. Tu obtiens un fichier à offrir : chaque case s\u2019ouvrira le bon jour de décembre.' })
    ),
    h('section', { class: 'ed-section' },
      h('h2', { text: 'Pour qui ?' }),
      h('div', { class: 'fields' },
        field('Prénom de la personne', 'to', 'Par exemple : Léa', 40),
        field('De la part de', 'from', 'Par exemple : Tom', 40),
        field('Titre du calendrier', 'title', 'Ton calendrier de l\u2019Avent', 60, 'full')
      )
    ),
    h('section', { class: 'ed-section' },
      h('h2', { text: 'Style' }),
      themeGroup,
      h('label', { class: 'check' }, freeBox, h('span', { text: 'Permettre d\u2019ouvrir toutes les cases tout de suite (pratique pour un cadeau offert en retard).' }))
    ),
    h('section', { class: 'ed-section' },
      h('h2', { text: 'Les 24 surprises' }),
      h('p', { class: 'hint', text: 'Un mot doux, un défi, un bon pour un câlin, un souvenir… Pas d\u2019inspiration ? Choisis pour qui est le calendrier, puis complète les cases vides ou demande une idée case par case.' }),
      h('div', { class: 'themes ideas-for', role: 'radiogroup', 'aria-label': 'Idées adaptées pour' },
        IDEA_LABELS.map(function (p) {
          var input = h('input', { type: 'radio', name: 'ideas', value: p[0], onchange: function () { draft.ideas = p[0]; save(); } });
          input.checked = (IDEA_PACKS[draft.ideas] ? draft.ideas : 'enfant') === p[0];
          return h('label', { class: 'theme-opt' }, input, h('span', { text: p[1] }));
        })
      ),
      h('div', { class: 'days-tools' }, h('button', { type: 'button', class: 'btn btn-ghost', onclick: fillIdeas }, 'Compléter les cases vides')),
      list
    ),
    h('div', { class: 'ed-foot' },
      h('button', { type: 'button', class: 'btn-link danger', onclick: function () {
        if (confirm('Effacer tous les messages et toutes les photos pour recommencer ?')) { draft = newDraft(); save(); renderEditor(); window.scrollTo(0, 0); }
      } }, 'Tout effacer et recommencer')
    )
  );
  var bar = h('div', { class: 'bar' }, h('div', { class: 'bar-in' },
    progressEl,
    h('div', { class: 'bar-actions' },
      h('button', { type: 'button', class: 'btn btn-ghost', onclick: openPreview }, 'Aperçu'),
      h('button', { type: 'button', class: 'btn btn-primary', onclick: download }, 'Télécharger le calendrier')
    )
  ));
  app.append(editor, bar);
  updateProgress();
}

/* ---------- Démarrage ---------- */
if (gift && Array.isArray(gift.days)) {
  document.body.className = 'mode-gift';
  document.title = (gift.title || '').trim() || 'Ton calendrier de l\u2019Avent';
  renderViewer(app, gift, {});
} else {
  renderEditor();
}
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Carte à gratter d’Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ed-bg:#F4F1F6; --ed-ink:#261B30; --ed-muted:#62586C; --ed-line:#DCD4E3;
  --ed-card:#FFFFFF; --ed-primary:#3A1F52; --ed-red:#B23A2B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.no-scroll{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
[hidden]{display:none !important}

/* ---------- Boutons ---------- */
.btn{border:0;border-radius:999px;padding:.7em 1.3em;font-weight:700;font-size:.95rem;line-height:1.2;text-decoration:none;display:inline-block}
.btn-primary{background:var(--ed-primary);color:#fff}
.btn-primary:hover{background:#2B163E}
.btn-ghost{background:#fff;color:var(--ed-primary);box-shadow:inset 0 0 0 2px var(--ed-primary)}
.btn-wa{background:#1F8F4E;color:#fff}
.btn-link{background:none;border:0;padding:0;color:var(--ed-primary);font-weight:700;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.btn-link:focus-visible,.chip:focus-visible,.theme-opt:focus-visible,.seg button:focus-visible,.lang button:focus-visible,input:focus-visible,textarea:focus-visible,.reveal-all:focus-visible{outline:3px solid #E8912D;outline-offset:2px}

/* ---------- Éditeur ---------- */
body.mode-editor{background:var(--ed-bg);color:var(--ed-ink)}
.editor{max-width:780px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 0}
.topbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.lang{display:inline-flex;gap:2px;background:#fff;border:1px solid var(--ed-line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:.3em .8em;font-weight:700;font-size:.82rem;color:var(--ed-muted)}
.lang button[aria-pressed="true"]{background:var(--ed-primary);color:#fff}
.ed-head h1{font-family:var(--serif);font-weight:800;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:0 0 .35em}
.ed-head p{color:var(--ed-muted);margin:0;max-width:60ch}
.ed-section{background:var(--ed-card);border:1px solid var(--ed-line);border-radius:18px;padding:22px;margin-top:22px}
.ed-section h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0 0 .3em}
.hint{color:var(--ed-muted);font-size:.92rem;margin:0 0 14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label,.flabel{font-weight:700;font-size:.9rem}
.field input,.field textarea{border:1.5px solid var(--ed-line);border-radius:10px;padding:.6em .75em;background:#fff;color:var(--ed-ink);font-size:1rem;width:100%}
.field textarea{min-height:88px;resize:vertical}
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:inline-flex;background:var(--ed-bg);border-radius:999px;padding:4px;gap:4px;margin:6px 0 16px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:.5em 1.1em;font-weight:700;color:var(--ed-muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ed-ink);box-shadow:0 1px 3px rgba(38,27,48,.2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ed-line);background:#fff;border-radius:999px;padding:.45em .95em;font-weight:600;font-size:.92rem;color:var(--ed-ink)}
.chip:hover{border-color:var(--ed-primary)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.theme-opt{border:2px solid var(--ed-line);border-radius:14px;background:#fff;padding:10px;text-align:left;color:var(--ed-ink)}
.theme-opt[aria-pressed="true"]{border-color:var(--ed-primary);box-shadow:0 0 0 2px var(--ed-primary)}
.theme-opt .sw{display:block;height:54px;border-radius:9px;margin-bottom:8px}
.theme-opt b{display:block;font-size:.95rem}
.theme-opt small{color:var(--ed-muted);font-size:.82rem}
.done{background:#FFF3E3;border:1px solid #F2C58E;border-radius:18px;padding:18px 22px;margin-top:22px}
.done h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:0 0 .3em}
.done p{margin:.2em 0 .8em}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkrow input{flex:1 1 260px;min-width:0;border:1.5px solid #E6C9A4;border-radius:10px;padding:.55em .7em;background:#fff;font-size:.9rem;color:var(--ed-ink)}
.linkbtns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.actions{position:sticky;bottom:0;margin-top:10px;padding:26px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(244,241,246,0),var(--ed-bg) 40%);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.actions .err{color:var(--ed-red);font-weight:700;font-size:.92rem;margin:0 auto 0 0;flex-basis:100%}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ed-ink);color:#fff;padding:.6em 1.1em;border-radius:999px;font-weight:600;font-size:.92rem;z-index:95;max-width:90vw;text-align:center}
.preview-layer{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--ed-bg)}
.preview-bar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--ed-ink);color:#fff;font-size:.9rem}
.preview-bar .btn-primary{background:#fff;color:var(--ed-ink)}
@media (max-width:600px){
  .fields{grid-template-columns:1fr}
  .themes{grid-template-columns:1fr}
  .theme-opt{display:flex;gap:12px;align-items:center}
  .theme-opt .sw{width:64px;height:44px;margin:0;flex:none}
}

/* ---------- Carte à offrir ---------- */
.t-citrouille{--bg:#1C1226;--ink:#2B1A10;--muted:#7A5236;--accent:#B8430F;--paper:#FFF6EA;--edge:#F29A3F;--credit:rgba(255,241,214,.75);
  background-color:var(--bg);
  background-image:radial-gradient(rgba(242,154,63,.45) 2px,transparent 3px),radial-gradient(rgba(160,120,200,.3) 1.5px,transparent 2.5px);
  background-size:72px 72px,72px 72px;background-position:0 0,36px 36px}
.t-sorciere{--bg:#24123A;--ink:#2A1640;--muted:#6A5680;--accent:#6B2FA3;--paper:#F8F3FC;--edge:#B58AD9;--credit:rgba(243,234,251,.75);
  background-color:var(--bg);
  background-image:radial-gradient(rgba(123,182,97,.45) 2px,transparent 3px),radial-gradient(rgba(242,154,63,.35) 1.5px,transparent 2.5px);
  background-size:80px 80px,80px 80px;background-position:0 0,40px 40px}
.t-fantome{--bg:#E9E3F2;--ink:#3B3050;--muted:#72678A;--accent:#C4571A;--paper:#FFFFFF;--edge:#D3C7E4;--credit:#6A5F80;
  background-color:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.9) 4px,transparent 5px),radial-gradient(rgba(242,154,63,.35) 2px,transparent 3px);
  background-size:96px 96px,96px 96px;background-position:0 0,48px 48px}
.card-host{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;color:var(--ink)}
.preview-layer .card-host{min-height:calc(100vh - 56px)}
.card{width:min(100%,520px);padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px));text-align:center}
.paper{background:var(--paper);border-radius:28px;padding:34px 22px 28px;box-shadow:0 24px 50px -20px rgba(0,0,0,.55);border:1px solid var(--edge)}
.to{font-weight:700;color:var(--muted);margin:0 0 .3em}
.intro{font-family:var(--serif);font-weight:800;font-size:clamp(1.7rem,7vw,2.35rem);line-height:1.1;margin:0 0 .3em;text-wrap:balance}
.instr{color:var(--muted);margin:0 0 22px;font-size:.95rem}
.zone{position:relative;border-radius:20px;overflow:hidden;background:#fff;min-height:200px;display:grid;place-items:center;border:2px solid var(--edge);user-select:none;-webkit-user-select:none}
.zone .hidden-content{padding:26px 20px}
.secret{font-family:var(--serif);font-weight:800;font-size:clamp(1.6rem,7vw,2.3rem);line-height:1.15;color:var(--accent);margin:0;text-wrap:balance}
.cases{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;user-select:none;-webkit-user-select:none}
.case{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center;border:2px solid var(--edge)}
.case span{font-family:var(--serif);font-weight:800;color:var(--accent);line-height:1.05;display:block;max-width:80%;overflow-wrap:normal;word-break:keep-all}
.scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;transition:opacity .7s ease}
.scratch.gone{opacity:0;pointer-events:none}
.reveal-all{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-top:18px;font-size:.88rem;padding:.3em}
.after{margin-top:24px}
.after.show{animation:rise .6s ease both}
.after .msg{font-size:1.1rem;white-space:pre-line;margin:0 0 .5em}
.after .from{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--muted);margin:0 0 .4em;white-space:pre-line}
.btn-card{background:var(--accent);color:#fff;margin-top:12px}
.btn-card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.broken{max-width:420px;margin:0 auto;text-align:center}
.credit{display:inline-block;margin-top:22px;padding:.4em .8em;font-size:.85rem;font-weight:700;color:var(--credit);text-decoration:none;border-radius:999px}
.credit:hover{text-decoration:underline;text-underline-offset:3px}
.credit:focus-visible{outline:2px solid var(--credit);outline-offset:2px}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:90}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.after.show{animation:none}.scratch{transition:none}}
</style>
</head>
